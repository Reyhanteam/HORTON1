services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: horton_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - horton

  nginx:
    image: nginx:1.27-alpine
    container_name: horton_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - horton

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: horton_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=120
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - horton

  mysql:
    image: mysql:8.4
    container_name: horton_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: horton
      MYSQL_USER: horton
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - horton_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_secret"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - horton

  redis:
    image: redis:7-alpine
    container_name: horton_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - horton_redis_data:/data
    networks:
      - horton

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: horton_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: "0"
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - horton

volumes:
  horton_mysql_data:
  horton_redis_data:

networks:
  horton:
    driver: bridge